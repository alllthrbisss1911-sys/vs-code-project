<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le génie — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.__ENV__ = {
      SUPABASE_URL: 'https://YOUR_PROJECT_REF.supabase.co',
      SUPABASE_ANON_KEY: 'YOUR_PUBLIC_ANON_KEY'
    };
  </script>
  <script src="supabase-config.js"></script>
  <script src="auth.js" defer></script>
</head>
<body class="auth-body" data-auth-mode="register">
  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <p class="eyebrow eyebrow-soft">Le génie</p>
        <h1>Create account</h1>
      </div>

      <form id="auth-form" class="auth-form" novalidate>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Create a password" required />
        </div>

        <button type="submit" class="send-button">CREATE ACCOUNT</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      <div id="auth-status" class="auth-status" aria-live="polite"></div>
    </div>
  </main>
</body>
</html>
